name: scholarshelf

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    env_file: .env.production
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [backend, edge]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [backend]
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE_PREFIX:-scholarshelf}/api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    command:
      [
        "/bin/sh",
        "-c",
        "node apps/api/node_modules/prisma/build/index.js migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/seed.js",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    image: ${APP_IMAGE_PREFIX:-scholarshelf}/api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
      recommendations:
        condition: service_started
    networks: [backend, edge]
    restart: unless-stopped

  recommendations:
    image: ${APP_IMAGE_PREFIX:-scholarshelf}/recommendations:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: services/recommendations/Dockerfile
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped

  web:
    image: ${APP_IMAGE_PREFIX:-scholarshelf}/web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file: .env.production
    depends_on:
      api:
        condition: service_started
    networks: [edge]
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, minio]
    networks: [edge]
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  minio_data:
  clamav_data:
  caddy_data:
  caddy_config:
